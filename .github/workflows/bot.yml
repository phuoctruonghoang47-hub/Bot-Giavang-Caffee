name: Bot giá vàng & cà phê

on:
  schedule:
    - cron: "30 1,4,9 * * *"   # Bản tin giá lúc 8:30, 11:30, 16:30 giờ VN (UTC+7)
    - cron: "*/30 * * * *"     # Quét tin mới + cảnh báo vàng mỗi 30 phút
  workflow_dispatch:           # Cho phép bấm chạy tay trên GitHub
    inputs:
      task:
        description: "Việc cần chạy"
        type: choice
        options: [prices, news, test]
        default: prices

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chạy bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="${{ inputs.task }}"
          elif [ "${{ github.event.schedule }}" = "30 1,4,9 * * *" ]; then
            TASK="prices"
          else
            TASK="news"
          fi
          echo "Task: $TASK"
          python bot.py "$TASK"

      - name: Lưu trạng thái (tin đã gửi, giá lần trước)
        run: |
          [ -f state/state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: cập nhật state [skip ci]"
          git pull --rebase -X theirs
          git push
